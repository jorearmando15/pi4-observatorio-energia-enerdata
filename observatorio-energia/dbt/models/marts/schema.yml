# Pruebas de dbt sobre la capa oro. "dbt build" las ejecuta despues de crear cada tabla.
# Es un archivo YAML: no se ejecuta; dbt lo lee para saber que probar en cada tabla.
#
# Convencion:
#   - En las DIMENSIONES, la llave lleva unique + not_null.
#   - En las tablas de HECHOS, cada llave lleva not_null + relationships
#     (apunta a la dimension donde vive esa llave).
#   - La descripcion de cada hecho empieza con "Grano:" para dejar claro
#     que representa una fila.

version: 2

models:
  # -------------------------------------------------------------------------
  # DIMENSIONES
  # -------------------------------------------------------------------------

  # Calendario diario.
  - name: dim_fecha
    description: "Un dia del calendario (2023-01-01 a 2026-12-31), con mes, trimestre, dia de la semana y fase ENSO."
    columns:
      - name: fecha_id
        description: "Llave: fecha como numero AAAAMMDD."
        data_tests: [unique, not_null]
      - name: fecha
        data_tests: [not_null]
      - name: fase_enso
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["El Niño", "La Niña", "Neutral", "Sin dato"]

  # Un mes con ventas.
  - name: dim_mes
    description: "Un mes con ventas, con su anio y trimestre."
    columns:
      - name: mes_id
        description: "Llave: anio y mes como numero AAAAMM (202304)."
        data_tests: [unique, not_null]

  # Un municipio de Antioquia.
  - name: dim_municipio
    description: "Un municipio de Antioquia con su codigo DIVIPOLA."
    columns:
      - name: municipio_id
        description: "Llave: codigo DIVIPOLA de 5 digitos (05001)."
        data_tests: [unique, not_null]

  # Un segmento de cliente.
  - name: dim_segmento
    description: "Un segmento de cliente (Comercial, Industrial, Residencial, No informado)."
    columns:
      - name: segmento_id
        description: "Llave: numero asignado al segmento."
        data_tests: [unique, not_null]

  # Una planta de generacion.
  - name: dim_recurso
    description: "Un recurso (planta) del catalogo de XM, con tipo, estado y si esta en el catalogo."
    columns:
      - name: recurso_id
        description: "Llave: codigo del recurso en XM (2QBW)."
        data_tests: [unique, not_null]

  # -------------------------------------------------------------------------
  # TABLAS DE HECHOS
  # -------------------------------------------------------------------------

  - name: fact_ventas_mensual
    description: >
      Ventas de energia de EnerAndes entre 2023 y 2026.
      Grano: un mes, un municipio, un segmento y un tipo de compra
      (una fila por cada combinacion de esas cuatro llaves).
    columns:
      # Llave al mes.
      - name: mes_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_mes')
                field: mes_id
      # Llave a la fecha (dia 1 del mes).
      - name: fecha_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_fecha')
                field: fecha_id
      # Llave al municipio.
      - name: municipio_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: municipio_id
      # Llave al segmento.
      - name: segmento_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_segmento')
                field: segmento_id
      # El tipo de compra es parte del grano: nunca vacio.
      - name: tipo_compra
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Bolsa", "Contrato"]

  - name: fact_mercado_horario
    description: >
      Precio de bolsa y demanda real del sistema electrico, tomados de XM.
      Grano: un dia y una hora (una fila por cada par fecha-hora; 24 filas por dia).
    columns:
      # Llave a la fecha.
      - name: fecha_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_fecha')
                field: fecha_id
      # La hora es parte del grano.
      - name: hora
        data_tests: [not_null]
      # Medidas.
      - name: precio_cop_kwh
        data_tests: [not_null]
      - name: demanda_kwh
        data_tests: [not_null]

  - name: fact_generacion_recurso
    description: >
      Generacion horaria de cada planta del sistema electrico, tomada de XM.
      Grano: un dia, una hora y un recurso (una fila por cada planta en cada hora de cada dia).
    columns:
      # Llave a la fecha.
      - name: fecha_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_fecha')
                field: fecha_id
      # La hora es parte del grano.
      - name: hora
        data_tests: [not_null]
      # Llave al recurso (planta).
      - name: recurso_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_recurso')
                field: recurso_id
      # Medida.
      - name: generacion_kwh
        data_tests: [not_null]
