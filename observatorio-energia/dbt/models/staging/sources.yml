# Las fuentes de dbt: las tablas que dbt va a leer.
# Es un archivo YAML: no se ejecuta; dbt lo lee para saber de donde salen los datos.
#
# - bronce: los Parquet tal como los deja el pipeline en data/bronze/.
#   Se usa para XM, NOAA y para las 4 hojas de EnerAndes (la capa plata
#   solo tiene la hoja 2023, y el modelo de ventas necesita 2023-2026).
# - plata: la tabla limpia de EnerAndes que genera src/silver/enerandes.py.
#   Se conserva declarada para los modelos que quieran leerla.

version: 2

sources:
  - name: bronce
    description: "Capa bronce: dato original + columnas de linaje (_fuente, _origen, _extraido_en)."
    meta:
      # dbt-duckdb lee cada tabla directo del Parquet de bronce.
      # {name} se reemplaza por el nombre de la tabla.
      external_location: "data/bronze/{name}.parquet"
    tables:
      - name: enerandes_ventas_2023
      - name: enerandes_ventas_2024
      - name: enerandes_ventas_2025
      - name: enerandes_ventas_2026
      - name: xm_precio_bolsa
      - name: xm_demanda
      - name: xm_generacion
      - name: xm_listado_recursos
      - name: noaa_oni

  - name: plata
    description: "Capa plata: ventas de EnerAndes limpias (por ahora solo la hoja 2023)."
    meta:
      external_location: "data/silver/{name}.parquet"
    tables:
      - name: enerandes_ventas
